name: Synthetic tests and package checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies
        run: python -m pip install -c requirements-discord.lock ".[discord]" "setuptools>=77.0.3" wheel
      - name: Offline synthetic suite
        run: python -B tools/test.py
      - name: Build and inspect the package
        run: python -B tools/package_check.py --output ../guildwake-package-results
